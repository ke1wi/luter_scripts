[project]
name = "scripts"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Volodymyr Klimchuk", email = "ke1wi.ua.work@gmail.com" }
]
dependencies = [
    "aiohttp>=3.11.18",
    "aiolimiter>=1.2.1",
    "httpx[http2]>=0.28.1",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "aiogram>=3.20.0.post0",
    "fastapi[standard]>=0.115.12",
    "ngrok>=1.4.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]
